name: jbedu-monitor

on:
  schedule:
    # 매시간 한 번 시동. 실행되면 안에서 60초 간격 루프를 ~5시간 50분 돌고,
    # 다음 실행은 concurrency 대기열에서 기다렸다가 바로 이어받는다 (cron 지연/누락 우회).
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "텔레그램/사이트 접속 테스트만 실행"
        type: boolean
        default: false
      minutes:
        description: "루프 실행 시간(분). 비우면 350"
        type: string
        default: ""

permissions:
  contents: write   # config.json / state.json 저장
  actions: write    # 스케줄 자동 정지 방지

concurrency:
  group: jbedu-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 테스트 (수동 실행 + send_test 체크 시)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        run: python3 monitor.py --test

      - name: 다음 실행 예약 (이 실행이 끝나면 대기열에서 바로 이어받음)
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.send_test || inputs.minutes != '')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml -R "${{ github.repository }}" || true

      - name: 스케줄 유지 (60일 무활동 자동 정지 방지)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable" || true

      - name: 예약현황 감시 루프 (60초 간격)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test) }}
        run: |
          timeout ${{ inputs.minutes || 350 }}m python3 -u monitor.py --loop --interval 60 --quiet 0-0 || [ $? -eq 124 ]

      - name: 설정/상태 저장 (바뀐 경우에만 커밋)
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.send_test) }}
        run: |
          git add config.json state.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "update state"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
          fi
